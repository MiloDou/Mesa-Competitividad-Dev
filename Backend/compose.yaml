services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mesa_competitividad}
      POSTGRES_USER: ${DB_USER:-mesa_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en Backend/.env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - mesa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mesa_app} -d ${DB_NAME:-mesa_competitividad}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mesa_postgres_data:
